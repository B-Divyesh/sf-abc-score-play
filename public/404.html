<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2e9d5" />
    <meta name="description" content="The requested ABC Score Play page was not found." />
    <meta name="robots" content="noindex" />
    <title>Page not found — ABC Score Play</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --canvas:#f2e9d5; --panel:#fff9ea; --ink:#202421; --teal:#146b66; --coral:#c54f38; --walnut:#513b2a; }
      * { box-sizing: border-box; }
      body { min-width:320px; margin:0; background:linear-gradient(rgba(81,59,42,.045) 1px,transparent 1px),var(--canvas); background-size:100% 8px; color:var(--ink); font:16px/1.55 ui-monospace,SFMono-Regular,"Cascadia Mono","Liberation Mono",monospace; }
      a { color:inherit; text-decoration-thickness:2px; text-underline-offset:3px; }
      :focus-visible { outline:3px solid var(--coral); outline-offset:3px; }
      .skip-link { position:fixed; z-index:2; top:8px; left:12px; padding:10px 14px; background:var(--panel); color:var(--ink); transform:translateY(-150%); }
      .skip-link:focus { transform:translateY(0); }
      .site-header { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:64px; padding:8px max(20px,calc((100vw - 760px)/2)); border-bottom:3px solid var(--walnut); background:var(--panel); }
      .wordmark { display:inline-flex; gap:10px; align-items:center; min-height:44px; font:800 1rem/1 "Arial Narrow",Arial,sans-serif; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; }
      .mark { display:grid; width:34px; height:34px; place-items:center; border:2px solid var(--ink); border-radius:50%; background:var(--coral); color:#fff; font-size:.78rem; }
      nav { display:flex; flex-wrap:wrap; gap:8px; }
      nav a { display:inline-flex; min-width:44px; min-height:44px; align-items:center; justify-content:center; font-size:.875rem; font-weight:700; }
      main { max-width:760px; min-height:65vh; margin:0 auto; padding:80px 24px; }
      .code { margin:0; color:var(--coral); font:900 clamp(5rem,20vw,7rem)/1 "Arial Narrow",Arial,sans-serif; }
      h1 { max-width:15ch; margin:8px 0 18px; font:800 clamp(2.5rem,7vw,4.8rem)/1.04 "Arial Narrow",Arial,sans-serif; letter-spacing:-.04em; }
      p { max-width:62ch; }
      .button { display:inline-flex; min-height:48px; align-items:center; justify-content:center; padding:10px 18px; border:2px solid var(--ink); border-radius:3px; background:var(--teal); box-shadow:3px 3px 0 var(--ink); color:#fff; font-weight:800; text-decoration:none; }
      footer { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; padding:20px max(24px,calc((100vw - 760px)/2)); border-top:3px solid var(--walnut); background:var(--panel); font-size:.78rem; }
      footer p { margin:0; }
      @media (max-width:540px) { .site-header { align-items:flex-start; padding:12px 16px; } .wordmark { max-width:130px; line-height:1.2; } main { padding:64px 18px; } footer { padding:18px; } }
      @media (prefers-color-scheme: dark) { :root { --canvas:#171c1b; --panel:#242b29; --ink:#f7eed9; --teal:#6bc7bc; --coral:#ff8e77; --walnut:#0e1211; } .button, .mark { color:#112321; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to page content</a>
    <header class="site-header"><a class="wordmark" href="/"><span class="mark" aria-hidden="true">ABC</span><span>Score Play</span></a><nav aria-label="Main navigation"><a href="/demo">Demo</a><a href="/#workbench">Editor</a><a href="/privacy">Privacy</a></nav></header>
    <main id="main" tabindex="-1">
      <p class="code" aria-hidden="true">404</p>
      <h1>This bar is not in the score</h1>
      <p>The page address does not match a part of ABC Score Play.</p>
      <a class="button" href="/">Return to the editor</a>
    </main>
    <footer><p>Write a short ABC score, hear it, and practice a loop.</p><nav aria-label="Footer navigation"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></nav><p>Built by Param Factory</p></footer>
  </body>
</html>
